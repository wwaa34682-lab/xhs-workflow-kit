name: 医疗（诊所、口腔、体检、康复等）
regulated: true
banned: [100%, 保证, 必定, 无效退款, 无痛, 根治, 治愈, 痊愈, 特效, 神效, 包好, 零风险, 无副作用, 第一品牌, 最便宜, 最先进, 最权威, 国际领先, 专家坐诊, 名医, 患者, 病友, 康复案例, 前后对比, 对比图, 疗程, 立竿见影, 永久, 一次见效]
allow: [第一次, 第一步, 第一节, 第一天]
banned_patterns:
  - '白(?:一|两|二|三|几)(?:个)?度'
  - '预防.{0,4}(?:病|炎|癌|症)'
  - '(?:治疗|治好|改善|缓解|消除).{0,6}(?:病|炎|痛|症|问题)'
  - '\d+\s*%\s*(?:有效|成功|治愈|满意)'
  - '(?:三甲|公立)(?:医院)?(?:医生|专家|主任)'
  - '(?:进口|德国|美国|瑞士|日本)(?:设备|材料|仪器|技术)'
  - '(?:顾客|患者|病人|用户)(?:说|反馈|评价)'
  - '(?:效果|结果)(?:显著|明显|立现|看得见|看得到|有保证)'
  - '(?:\d+|[一二两三四五六七八九十半几]+)\s*(?:天|次|周|个月|月|疗程)\s*(?:就能|就|能|即可|内)?\s*(?:见效|好转|恢复|痊愈|治好|改善|变白|消失|告别)'
  - '(?:轻松|快速|迅速|马上|立刻|当天)(?:见效|恢复|缓解|治好|告别|变白)'
  - '(?:看得见|看得到)的?(?:效果|变化)'
required_disclaimers: ['以医生面诊为准']    # 写法可以是“具体以医生面诊为准”“方案以医生面诊为准”
qualification_terms: [三甲, 公立, 主任医师, 副主任医师, 博士, 教授, 认证, 国际标准, 进口, 执业, 许可证, 广告审查, 专利]
story_rule: 'off'
disable_rules: [SL-G10, SL-G15]
extra_required:
  - {key: qualifications, label: 可以说的资质, check: list, ask: 机构有哪些资质可以在帖子里说？请给原文（如“医疗机构执业许可证”、医生执业资格），都不说就回“无”}
  - {key: compliance.ad_review, label: 医疗广告审查证明, ask: 投流的话，有没有医疗广告审查证明？证明编号是什么？, options: [有（请给编号）, 没有（不能投流，只发自然流量）]}
  - {key: compliance.reviewer, label: 合规审核人, ask: 谁来做合规审核？（和专家评审可以不是同一个人，发布前两个人都要过）, options: [院长/机构负责人, 外部合规顾问, 其他（请说明）]}
  - {key: compliance.doctor_exposure, label: 医生能否露出, ask: 医生的姓名、照片、职称能不能出现在帖子里？, options: [可以，已签授权（请列出是谁）, 不可以]}
