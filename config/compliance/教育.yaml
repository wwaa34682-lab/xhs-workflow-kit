name: 教育培训（含学科、语言、职业、艺术体育）
regulated: true
banned: [100%, 保证, 必过, 包过, 稳过, 保录, 提分保障, 无效退款, 押题, 名师, 状元, 第一品牌, 最便宜, 最权威]
allow: [第一次, 第一步, 第一节, 第一课, 第一天]
banned_patterns:                # 效果承诺是教育合规最常见的雷：时间 + 效果、效果形容、提分、学会多少个
  - '(?:提|涨)\s*\d+\s*分'
  - '(?:\d+|[一二两三四五六七八九十半几]+)\s*(?:天|周|个月|月|年|节课?|堂课?|次课?|课时)\s*(?:就能|就会|就|能|便|即可|可以|也能|内)?\s*(?:开口|张口|说|流利|学会|学完|掌握|搞定|精通|过级|上岸|背下|背会|记住|认识|读懂|提升|提高)'
  - '效果(?:看得见|看得到|显著|明显|立现|立竿见影|保障|有保证)'
  - '(?:看得见|看得到)的?(?:效果|进步|变化)'
  - '提分|涨分|(?:成绩|分数)(?:提升|提高|飞跃|突飞猛进)'
  - '(?:学会|掌握|记住|认识|背会)\s*(?:\d+|[一二两三四五六七八九十百几]+)\s*个'
  - '(?:轻松|快速|迅速|马上|立刻)(?:开口|学会|掌握|提分|流利|过级)'
  - '(?:通过率|录取率|升学率|就业率)\s*\d+'
  - '(?:考试|命题)(?:专家|组)'
  - '(?:学员|家长)(?:说|反馈|评价)'
required_disclaimers: []
qualification_terms: [办学许可, 资质, 认证, 官方, 授权, 合作院校, 教师资格, 证书]
fact_terms: [外教, 外籍老师, 外籍教师, 母语老师, 小班, 一对一, 试听, 课后反馈]   # 这些说法要在 offer / qualifications 里有出处（“外教”要核对 offer）
story_rule: 'off'
disable_rules: [SL-G10]
extra_required:
  - {key: qualifications, label: 可以说的资质, check: list, ask: 有哪些资质可以说？（办学许可、教师资格、合作授权）请给原文，都不说就回“无”}
  - {key: compliance.reviewer, label: 合规审核人, ask: 谁来做合规审核？, options: [校长/负责人, 外部合规顾问, 其他（请说明）]}
  - {key: compliance.minor_audience, label: 是否面向未成年人, step: 0, ask: 课程面向未成年人吗？（建档时就问：决定文案和投流能不能做）, options: [是（不得面向中小学生做学科类校外培训宣传；投流前合规审核人还要单独确认一次）, 否]}
