name: 医美与美容（含光电、注射、皮肤管理）
regulated: true
banned: [100%, 保证, 必定, 无效退款, 无痛, 根治, 永久, 零风险, 无副作用, 包好, 立竿见影, 一次见效, 前后对比, 对比图, 案例图, 素人改造, 逆龄, 冻龄, 回春, 网红同款, 明星同款, 最便宜, 最权威, 国际领先]
allow: [第一次, 第一步]
banned_patterns:
  - '(?:年轻|小)\s*\d+\s*岁'
  - '\d+\s*(?:天|次|周)\s*(?:见效|变白|瘦|淡斑|祛)'
  - '(?:祛|消除|去除).{0,4}(?:斑|痘|纹|疤)'
  - '(?:进口|韩国|美国|瑞士)(?:仪器|设备|针剂|产品)'
  - '(?:顾客|用户|姐妹)(?:说|反馈|评价)'
required_disclaimers: ['效果因人而异']
qualification_terms: [医疗美容, 执业, 许可证, 认证, 正品, 授权, 进口, 专利, 主诊医生]
story_rule: 'off'
disable_rules: [SL-G10]
extra_required:
  - {key: qualifications, label: 可以说的资质, check: list, ask: 有哪些资质可以说？（是否为医疗美容机构、主诊医生资质、产品正品授权）请给原文，都不说就回“无”}
  - {key: compliance.reviewer, label: 合规审核人, ask: 谁来做合规审核？（发布前要过）, options: [店长/机构负责人, 外部合规顾问, 其他（请说明）]}
  - {key: compliance.medical_items, label: 有没有医美项目, ask: 有没有医疗美容项目（注射、光电、手术）？, options: [有（只能由医疗美容机构发布，并按医疗广告管）, 没有，只做生活美容]}
